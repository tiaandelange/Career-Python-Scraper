[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scout"
version = "0.1.0"
description = "Automated global job discovery for a mechanical / infrastructure engineer, with remote, hybrid and on-site pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Job Scout" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "supabase>=2.6",
  "python-dateutil>=2.9",
  "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]
browser = [
  "playwright>=1.45",
]

[project.scripts]
job-scout-scrape = "job_scout.orchestration.run_scrapers:main"
job-scout-digest = "job_scout.orchestration.send_digest:main"
job-scout-health = "job_scout.orchestration.health_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "live: hits the public internet (disabled unless --live or JOB_SCOUT_LIVE=1)",
]

[tool.coverage.run]
source = ["job_scout"]
omit = ["*/tests/*"]
