name: digest

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Africa/Johannesburg"
  workflow_dispatch:

concurrency:
  group: job-scout-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      JOB_SCOUT_ENV: github
      JOB_SCOUT_SEND_EMAIL: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Verify Resend secrets
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM" ] || [ -z "$DIGEST_TO" ]; then
            echo "Missing RESEND_API_KEY, RESEND_FROM or DIGEST_TO repository secrets."
            exit 1
          fi
          echo "Resend secrets are present."
      - name: Send digest
        run: python -m job_scout digest --send
