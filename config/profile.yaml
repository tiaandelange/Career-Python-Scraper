# Titles in other engineering disciplines that leaked in through description keywords
# ("infrastructure", "plant", "water"). Regexes, matched case-insensitively against the
# title. A title that also names one of `keep_if_title_has` stays (e.g. "Electrical &
# Mechanical Inspector", "Mechanical Engineer - Battery Hardware").
exclude_titles:
  patterns:
    - '\belectrical\b'
    - '\belectrician'
    - '\belectronics?\b'
    - '\bpower (electronics|systems?|distribution|engineer)'
    - '\binstrumentation\b'
    - '\bi\s*&\s*c\b'
    - '\bi&e\b'
    - '\bscada\b'
    - '\bplc\b'
    - '\b(automation|controls?)\s*(and|&)\s*(controls?|automation|electrical)\b'
    - '(?<!project )\bcontrols? (engineer|specialist|technician|designer|lead|manager|automation)'
    - '\bautomation (engineer|specialist|technician)'
    - '\bsubstation\b'
    - '\bprotection and control\b'
    - '\b(firmware|embedded|pcb|rf|fpga|asic|semiconductor|silicon)\b'
    - '\bsoftware\b'
    - '\b(data|ml|machine learning) (engineer|scientist)'
    - '\bbess electrical\b'
    - '\bhigh voltage\b|\bmedium voltage\b|\blow voltage\b|\b[lmh]v (power|distribution)'
    - '\btelecom|\bnetwork engineer'
    - '\bhardware\b'
    - '\bcontrol systems?\b|\bmotion control\b'
    - '\bdata (platforms?|infrastructure)\b'
    - '\bpower delivery\b|\btransmission (line|lines|engineer)'
    - '\binstrument(ation)?\s*(&|and)\s*controls?\b'
  # Excluded even when the title also says "mechanical" or "civil" (academic posts need a PhD;
  # interns/students are not the target level).
  always:
    - '\b(assistant|associate|full|adjunct|visiting|clinical)?\s*professor\b'
    - '\blecturer\b|\bpostdoc|\bpost-doctoral|\bfaculty\b|\bdepartment (head|chair)\b'
    - '\bintern\b|\binternship\b|\bco-op\b|\bstudent\b|\bgraduate\b|\bentry[- ]level\b|\bearly career\b|\bnew grad\b'
    - '\bai (model )?(evaluator|trainer)\b'
  keep_if_title_has:
    - mechanical
    - civil
    - structural
    - piping
    - hvac
    - quality
    - 'qa/qc'
    - 'qa / qc'
    - qaqc
    - inspector
    - inspection

# Employers to drop whichever site lists them. Defence / ITAR employers hire "U.S. persons"
# only, so a visa applicant cannot be hired; aggregators (Adzuna) still surface them and
# their short snippets hide the export-control wording. Matched on the company name.
exclude_employers:
  - SpaceX
  - Space Exploration Technologies
  - Anduril
  - Saronic
  - Hermeus
  - Relativity Space
  - Lockheed Martin
  - Northrop Grumman
  - Raytheon
  - RTX
  - General Dynamics
  - BAE Systems
  - L3Harris
  - Huntington Ingalls
  - Leidos
  - SAIC
  - Booz Allen
  - Sierra Nevada Corporation
  - Blue Origin
  - United Launch Alliance
  - Textron
  - DataAnnotation

