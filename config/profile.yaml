candidate:
  name: "Mechanical / infrastructure engineer"
  summary: >
    BEng Mechanical Engineering professional with ECSA registration, mechanical
    design and engineering experience, and acting Chief Engineer / mechanical
    design leadership. Strong water-infrastructure background covering dams and
    water-control works, pipelines, pumps, valves and mechanical equipment,
    specifications, BOQs, design reports, technical reviews, site inspections,
    QA/QC, manufacturing inspections, materials and corrosion, contractor and
    consultant coordination, engineering project management, and contract /
    technical administration. Familiar with DWS engineering standards, SANS,
    GCC and FIDIC environments, plus leadership of multidisciplinary teams.
  qualifications:
    - BEng Mechanical Engineering
    - ECSA registered engineering professional
  do_not_claim:
    - career senior software engineer
    - deep traditional computer-science / software-architecture specialism
    - US, EU or Australian work rights unless a role offers sponsorship

primary_capabilities:
  - mechanical design
  - mechanical engineering
  - engineering leadership
  - chief engineer
  - water infrastructure
  - dams
  - water-control infrastructure
  - pipelines
  - pumps
  - pumping systems
  - valves
  - mechanical equipment
