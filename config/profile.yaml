  - multidisciplinary coordination

digital_transferable:
  note: >
    Legitimate founder / lead-developer style experience with AI-assisted
    software development, web development, Next.js, Supabase, workflow
    automation, business systems, SEO and digital product development.
    Do not score as equivalent to a career senior software engineer where
    the advertisement requires deep traditional CS experience.
  skills:
    - AI-assisted software development
    - web development
    - Next.js
    - Supabase
    - workflow automation
    - business systems
    - SEO
    - digital product development
    - technical problem solving
    - low-code
    - no-code
    - process automation
  not_equivalent_to:
    - senior software engineer
    - staff software engineer
    - principal software engineer
    - java architect
    - solutions architect (enterprise java/.net)
    - machine learning researcher
    - data scientist (research)
    - embedded firmware specialist
    - kernel / systems programmer

