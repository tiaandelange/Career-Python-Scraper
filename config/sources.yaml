defaults:
  timeout_seconds: 25
  retries: 3
  backoff_seconds: 1.5
  request_delay_seconds: 1.0
  max_pages: 4
  max_job_age_days: 45
  max_jobs_per_source: 250
  user_agent_env: JOB_SCOUT_USER_AGENT

# Each source is independently enabled. Adapters never scrape behind
# CAPTCHAs, logins, or anti-bot walls. LinkedIn and Indeed are excluded.

sources:
  remoteok:
    enabled: true
    adapter: job_scout.adapters.remote.remoteok:RemoteOKAdapter
    source_type: api
    pipelines: [remote]
    regions: [global]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: aggregator
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    notes: Official public JSON dump. One request. Filter client-side.

  remotive:
    enabled: true
    adapter: job_scout.adapters.remote.remotive:RemotiveAdapter
    source_type: api
    pipelines: [remote]
    regions: [global]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    notes: Official public API. Category + search filters.

  jobicy:
    enabled: true
    adapter: job_scout.adapters.remote.jobicy:JobicyAdapter
    source_type: api
    pipelines: [remote]
    regions: [global]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    notes: Official public API, max 100 jobs per call. No key.

  himalayas:
    enabled: true
    adapter: job_scout.adapters.remote.himalayas:HimalayasAdapter
    source_type: api
    pipelines: [remote]
    regions: [global]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_pages: 3
    notes: Official public API with location and timezone restrictions. 20 jobs/page. Daily cache on their side.

  weworkremotely:
    enabled: true
    adapter: job_scout.adapters.remote.weworkremotely:WeWorkRemotelyAdapter
    source_type: rss
    pipelines: [remote]
    regions: [global]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    notes: Official category RSS feeds. No HTML scraping.

  greenhouse:
    enabled: true
    adapter: job_scout.adapters.ats.greenhouse:GreenhouseAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, ZA, US, EU, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    employers:
      - {name: MacKay / Engineering Analytics, slug: mackaysposito}
      - {name: BGE Inc, slug: bgeinc}
      # US energy / cleantech / manufacturing employers hiring mechanical & project engineers
      # (slugs verified live 2026-11-19). ITAR/defence boards (SpaceX, Anduril, Relativity)
      # are deliberately excluded: they require US persons and cannot sponsor visas.
      - {name: Fervo Energy, slug: fervoenergy}
      - {name: Redwood Materials, slug: redwoodmaterials}
      - {name: Zipline, slug: flyzipline}
      - {name: Xometry, slug: xometry}
      - {name: Kairos Power, slug: kairospower}
      - {name: Oklo, slug: oklo}
      - {name: Antora Energy, slug: antora}
      - {name: Lucid Motors, slug: lucidmotors}
      - {name: Pacific Fusion, slug: pacificfusion}
      - {name: Quaise Energy, slug: quaise}
      - {name: Solid Power, slug: solidpower}
      - {name: Our Next Energy, slug: onenergy}
      # Second batch (verified 2026-11-19): data-centre, thermal storage, nuclear/fusion, robotics.
      - {name: CoreWeave, slug: coreweave}
      - {name: Submer, slug: submer}
      - {name: Rondo Energy, slug: rondoenergy}
      - {name: Valar Atomics, slug: valaratomics}
      - {name: Thea Energy, slug: thea}
      - {name: Formic, slug: formic}
      - {name: Electra Aero, slug: electraaero}
      # US civil / water engineering consultancies (verified 2026-11-19)
      - {name: Olsson, slug: olsson}
      - {name: Burgess & Niple, slug: burgessniple}
    notes: Public boards API. Water/dams/pipeline boards plus verified US energy and manufacturing employers.

  lever:
    enabled: true
    adapter: job_scout.adapters.ats.lever:LeverAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, ZA, US, EU, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    employers:
      - {name: Woodard & Curran, slug: woodardcurran}
      - {name: Stanley Consultants, slug: stanleygroup}
      - {name: Black & Veatch, slug: bv}
      - {name: Commonwealth Fusion Systems, slug: cfsenergy}
      - {name: Charm Industrial, slug: charmindustrial}
      - {name: Bedrock Energy, slug: bedrockenergy}
      - {name: Sila Nanotechnologies, slug: sila}
      - {name: Exowatt, slug: exowatt}
    notes: Public postings JSON. Water/utility consulting plus verified US energy employers.

  ashby:
    enabled: true
    adapter: job_scout.adapters.ats.ashby:AshbyAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, US, EU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    employers:
      - {name: Hatch, slug: hatch}
      - {name: Twelve, slug: twelve}
      - {name: Crusoe, slug: crusoe}
      - {name: Helion Energy, slug: helion}
      - {name: Dandelion Energy, slug: dandelion}
      - {name: Heirloom Carbon, slug: heirloomcarbon}
      - {name: Vantage Data Centers, slug: vantage}
      - {name: Aligned Data Centers, slug: aligned}
    notes: Public job-board API (slugs verified live 2026-11-19).

  workday:
    enabled: true
    adapter: job_scout.adapters.ats.workday:WorkdayAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [US, global]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    request_delay_seconds: 1.5
    max_pages: 1
    max_jobs_per_employer: 20
    searches: [mechanical engineer, quality, civil engineer]
    employers:
      # Only Primoris (pod wd108) answers automated requests. The wd3/wd5 tenants below return
      # 429 to every non-browser client (verified from home and from GitHub Actions on
      # 2026-11-19), so they are disabled rather than worked around.
      - {name: Primoris, tenant: prim, pod: wd108, site: Primoris}
      - {name: Xylem, tenant: xylem, pod: wd5, site: xylem-careers, enabled: false}
      - {name: Mueller Water Products, tenant: muellerwaterproducts, pod: wd5, site: Mueller, enabled: false}
      - {name: Badger Meter, tenant: badgermeter, pod: wd5, site: US_CareerSite, enabled: false}
      - {name: HNTB, tenant: hntb, pod: wd5, site: HNTB_Careers, enabled: false}
      - {name: Morrison Hershfield (Stantec), tenant: morrisonhershfield, pod: wd3, site: morrisonhershfieldcareers, enabled: false}
      - {name: GE Vernova, tenant: gevernova, pod: wd5, site: Vernova_ExternalSite, enabled: false}
    notes: >
      Public Workday candidate-experience JSON (the endpoints the career site itself calls).
      Searches a few keywords per employer and pre-filters titles before detail calls because
      Workday rate-limits per IP. Add employers as {tenant, pod, site} from their careers URL:
      https://{tenant}.{pod}.myworkdayjobs.com/{site}

  smartrecruiters_sgs:
    # Separate entry so SGS gets its own time budget and fetches in parallel with AECOM.
    enabled: true
    adapter: job_scout.adapters.ats.smartrecruiters:SmartRecruitersAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [US, ZA]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    request_delay_seconds: 0.5
    employers:
      # Global inspection / testing / certification: 4,500+ postings, so search by keyword
      # and country instead of paging the whole board.
      - name: SGS
        slug: sgs
        queries: [inspector, quality, welding, mechanical]
        countries: [us, za]
        max_pages: 1
        max_jobs: 60
    notes: SGS QA/QC and inspection roles (verified 2026-11-19).

  successfactors:
    enabled: true
    adapter: job_scout.adapters.ats.successfactors_rss:SuccessFactorsRssAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, US, ZA, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    searches: [mechanical, quality, inspector, civil, piping, water]
    sites:
      - {name: Black & Veatch, slug: blackveatch, host: careers.bv.com}
      - {name: Hatch, slug: hatch, host: jobs.hatch.com}
      - {name: Sasol, slug: sasol, host: jobs.sasol.com}
    notes: >
      SAP SuccessFactors career-site RSS (/services/rss/job/?keywords=). Verified 2026-11-19 on
      Black & Veatch, Hatch and Sasol. Most other SuccessFactors sites have the feed disabled.

  oracle_cx:
    enabled: true
    adapter: job_scout.adapters.ats.oracle_cx:OracleCxAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, US, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    max_pages: 1
    searches: [mechanical, quality, civil, water, inspector]
    employers:
      - {name: GHD, slug: ghd, host: ejov.fa.ca2.oraclecloud.com, site: CX, countries: [US, ZA, AU, GB, IE, NZ], max_jobs: 60}
    notes: >
      Oracle Recruiting Cloud public JSON (the career site's own endpoints). Add an employer
      from its careers URL: https://{host}/hcmUI/CandidateExperience/en/sites/{site}/...

  ym_careers:
    enabled: true
    adapter: job_scout.adapters.regional.ym_careers:YmCareersAdapter
    source_type: rss
    pipelines: [remote, hybrid, onsite]
    regions: [US]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    searches: [mechanical engineer, civil engineer, quality engineer, inspector, water, project engineer]
    boards:
      - {slug: nspe, host: careers.nspe.org}
    notes: >
      Association career centres on YM Careers. NSPE's RSS is open; AWWA, ASCE, ASQ, ASME and
      ASHRAE return 403 to automated clients and are deliberately not used.

  smartrecruiters:
    enabled: true
    adapter: job_scout.adapters.ats.smartrecruiters:SmartRecruitersAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, ZA, US, EU, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    max_pages: 2
    max_jobs_per_source: 400
    employers:
      - {name: AECOM, slug: AECOM2}
      - {name: Ingerop, slug: Ingerop}
      - {name: Ramboll, slug: Ramboll3}
    notes: Verified water/dams consulting boards. Caps pages to limit Actions minutes (AECOM is large).

  workable:
    enabled: false
    adapter: job_scout.adapters.ats.workable:WorkableAdapter
    source_type: ats
    pipelines: [remote, hybrid, onsite]
    regions: [global, ZA, US, EU, AU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: employer_ats
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    employers: []
    notes: Disabled until verified employer slugs are added.

  eures:
    enabled: true
    adapter: job_scout.adapters.regional.eures:EuresAdapter
    source_type: api
    pipelines: [hybrid, onsite]
    regions: [EU, EEA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_pages: 2
    notes: Official EU EURES public job-search JSON. Keyword-limited queries.

  arbeitnow:
    enabled: true
    adapter: job_scout.adapters.regional.arbeitnow:ArbeitnowAdapter
    source_type: api
    pipelines: [hybrid, onsite, remote]
    regions: [EU]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    notes: Public European job-board JSON API. No key.

  reliefweb:
    enabled: true
    adapter: job_scout.adapters.regional.reliefweb:ReliefWebAdapter
    source_type: rss
    pipelines: [hybrid, onsite, remote]
    regions: [global, ZA, EU, AU, US]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    notes: Official ReliefWeb jobs RSS (WASH / humanitarian / infrastructure). REST jobs API returned 410; RSS verified 200.

  remote1stjobs:
    enabled: true
    adapter: job_scout.adapters.remote.remote1stjobs:Remote1stJobsAdapter
    source_type: api
    pipelines: [remote]
    regions: [global, EU]
    coverage: {remote: true, hybrid: false, onsite: false}
    preference: specialist_board
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: false
    notes: Public jobs.json dump. Broad remote feed; family filter keeps mechanical/infra hits.

  dpsa_circular:
    enabled: true
    # Returns 403 to GitHub's cloud runners (works from a South African home connection).
    # Skipped in CI so it is not reported as broken every day; saved jobs keep until closing.
    skip_in_ci: true
    adapter: job_scout.adapters.regional.dpsa_circular:DpsaCircularAdapter
    source_type: html
    pipelines: [onsite, hybrid]
    regions: [ZA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_circulars: 2
    notes: >
      Weekly DPSA Public Service Vacancy Circular section PDFs (e.g. Limpopo s.pdf).
      Parses annual ZAR salaries (OSD grades). Filters to engineering/infra keywords.
      National DWS and provincial Engineering Services posts appear here when advertised.

  dws_vacancies:
    enabled: true
    # Returns 403 to GitHub's cloud runners (works from a South African home connection).
    # Skipped in CI so it is not reported as broken every day; saved jobs keep until closing.
    skip_in_ci: true
    adapter: job_scout.adapters.regional.dws_vacancies:DwsVacanciesAdapter
    source_type: html
    pipelines: [onsite, hybrid]
    regions: [ZA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_bulletins: 3
    notes: >
      Department of Water and Sanitation HTML bulletins (vacancies/default.aspx →
      current/{date}.aspx) with per-post PDFs and erecruitment.dws.gov.za apply links.

  dpwi_vacancies:
    enabled: true
    adapter: job_scout.adapters.regional.dpwi_vacancies:DpwiVacanciesAdapter
    source_type: html
    pipelines: [onsite, hybrid]
    regions: [ZA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_pdfs: 3
    notes: >
      DPWI vacancies.html index of DPSA-format PDF adverts (mechanical / civil /
      construction project management). Complements the weekly DPSA circular.

  sanral_vacancies:
    enabled: false
    adapter: job_scout.adapters.regional.sanral_vacancies:SanralVacanciesAdapter
    source_type: html
    pipelines: [onsite, hybrid]
    regions: [ZA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: true
    salary_often_available: false
    notes: >
      SANRAL open vacancies at nra.co.za/sanral-careers. Listing is JS-rendered;
      disabled until a non-JS feed or Playwright path is approved.

  sa_pdf_boards:
    enabled: true
    adapter: job_scout.adapters.regional.sa_pdf_boards:SaPdfBoardAdapter
    source_type: html
    pipelines: [onsite, hybrid]
    regions: [ZA]
    coverage: {remote: false, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: false
    javascript_required: false
    salary_often_available: true
    max_pdfs_per_board: 10
    boards:
      - slug: magalies_water
        name: Magalies Water
        index_url: https://magalieswater.co.za/job-openings/
        hosts: [magalieswater.co.za, www.magalieswater.co.za]
      - slug: lepelle_northern_water
        name: Lepelle Northern Water
        index_url: https://lepellewater.co.za/vacancies/
        hosts: [lepellewater.co.za, www.lepellewater.co.za]
      - slug: overberg_water
        name: Overberg Water
        index_url: https://www.overbergwater.co.za/index.php/contact-us?id=10&layout=edit&view=article
        hosts: [www.overbergwater.co.za, overbergwater.co.za]
    notes: >
      Water-board / SOE HTML indexes that publish vacancy PDFs (Magalies, Lepelle,
      Overberg). Complements DWS bulletins and DPSA circulars.

  usajobs:
    enabled: false
    adapter: job_scout.adapters.regional.usajobs:UsaJobsAdapter
    source_type: api
    pipelines: [hybrid, onsite]
    regions: [US]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: government
    free: true
    auth_required: true
    javascript_required: false
    salary_often_available: true
    notes: Official USAJOBS API. Disabled until USAJOBS_API_KEY is set. Many roles require US citizenship.

  adzuna:
    enabled: true
    adapter: job_scout.adapters.regional.adzuna:AdzunaAdapter
    source_type: api
    pipelines: [hybrid, onsite]
    regions: [ZA, US, AU, GB, DE, FR, NL]
    coverage: {remote: true, hybrid: true, onsite: true}
    preference: aggregator
    free: true
    auth_required: true
    javascript_required: false
    salary_often_available: true
    # Free tier: 25 calls/min, 250/day. 20 calls x 3 scrapes/day = 60/day (~1,800/month).
    max_calls: 20
    max_pages: 1
    request_delay_seconds: 2.5
    max_job_age_days: 30
    searches:
      us: [mechanical engineer, water engineer, project engineer, pipeline engineer, engineering project manager,
           water treatment engineer, quality engineer, qa qc engineer, source inspector, civil engineer]
      za: [mechanical engineer, project manager, quality engineer, civil engineer]
    notes: >
      Official free developer API. Fetches nothing until ADZUNA_APP_ID and ADZUNA_APP_KEY are set
      (GitHub secrets / local .env). Adzuna's predicted salaries (salary_is_predicted=1) are ignored.

disabled_not_implemented:
  linkedin:
    reason: ToS / anti-bot. Not a project dependency.
  indeed:
    reason: ToS / anti-bot. Not a project dependency.
  teachaway:
    reason: Teacher niche only; no official public jobs API/RSS for this candidate profile.
  facebook:
    reason: Meta login / anti-bot; no free personal jobs API.
  sa_gov_gazette:
    reason: Gazette notices are not a stable vacancy API; engineer posts are covered via DPSA circular PDFs.
  limpopo_gov_site:
    reason: Provincial marketing site; vacancies are published through DPSA circular section PDFs.
  western_cape_erecruit:
    reason: >
      westerncapegov.erecruit.co categories are present but job cards need authenticated/search
      session handling; track separately from static HTML/PDF boards.
  gauteng_jobs_portal:
    reason: jobs.gauteng.gov.za is a thin landing page; listings need deeper portal session work.
  city_of_joburg_vacancies:
    reason: SharePoint vacancy index currently points to thin category pages, not scrapeable job PDFs.
  sanral_js_careers:
    reason: nra.co.za open-vacancies table is JS-rendered (adapter exists but disabled).
  rand_water_erecruit:
    reason: erecruit portal / login-gated; no stable unauthenticated HTML feed.
  pnet:
    reason: No official public API; HTML is JS-heavy and not permitted automation.
  careerjunction:
    reason: No official public API.
  seek:
    reason: No official public API; commercial ToS restrict scraping.
  glassdoor:
    reason: Estimates are forbidden as salary evidence; site is anti-bot.
  devex:
    reason: Member job-posting API, not free public retrieval of listings.
  rigzone:
    reason: News RSS only; jobs require scraping or paid tooling.
  careermine:
    reason: jobsrss endpoint returns bot-check HTML, not a usable feed.
  un_careers:
    reason: Published jobfeed URL returns SPA HTML, not RSS/XML.
  aps_jobs:
    reason: Salesforce/JS career site; would need browser automation.
